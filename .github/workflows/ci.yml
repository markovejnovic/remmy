name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Pinned wheel: the same formatter on every runner, without Homebrew.
      - name: Check formatting
        run: git ls-files '*.c' '*.h' '*.cpp' '*.hpp' | xargs uvx clang-format==22.1.8 --style=file --dry-run --Werror

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --locked ruff check tests
      - run: uv run --locked ruff format --check tests

  clang-tidy:
    name: clang-tidy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install llvm ninja
      - name: Put Homebrew LLVM first on PATH
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      # The lint preset compiles cutils with clang++ and runs clang-tidy on every
      # translation unit; .clang-tidy makes every warning an error.
      - run: cmake --preset lint
      - run: cmake --build --preset lint

  cutils:
    name: cutils (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC is the only compiler that builds the reflection tests.
          - name: gcc asan
            cxx: g++-16
            tsan: "OFF"
            brew: gcc ninja
          # Clang adds integer, bounds and nullability checks.
          - name: clang asan
            cxx: clang++
            tsan: "OFF"
            brew: llvm ninja
          - name: clang tsan
            cxx: clang++
            tsan: "ON"
            brew: llvm ninja
    steps:
      - uses: actions/checkout@v4
      - run: brew install ${{ matrix.brew }}
      - name: Put Homebrew LLVM first on PATH
        if: contains(matrix.brew, 'llvm')
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: cutils-macos-${{ matrix.name }}
      - name: Configure
        run: >
          cmake -S cutils -B build/cutils -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCUTILS_TEST_TSAN=${{ matrix.tsan }}
      - run: cmake --build build/cutils
      - run: ctest --test-dir build/cutils --output-on-failure

  remmy:
    name: remmy (${{ matrix.preset }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - run: brew install gcc ninja
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: remmy-macos-${{ matrix.preset }}
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset ${{ matrix.preset }}
      # The runner's disk makes the FAT32/ExFAT image tests I/O-bound; keep the
      # images in RAM (mountpoints stay in TMPDIR, see tests/volumes.py).
      - name: RAM disk for test disk images
        run: |
          dev=$(hdiutil attach -nomount ram://4194304 | awk '{print $1}')
          diskutil erasevolume APFS remmy-ram "$dev"
          echo "REMMY_TEST_IMAGE_DIR=/Volumes/remmy-ram" >> "$GITHUB_ENV"
      # Runs the pytest end-to-end suite (tests/) against the built executable.
      # Parity checks output bytes, not build-type behaviour: release covers it.
      - run: ctest --preset ${{ matrix.preset }} -V
        env:
          PYTEST_ADDOPTS: ${{ matrix.preset == 'debug' && '-m "not parity" -v --durations=60' || '-v --durations=60' }}

  # Linux runs GCC from Homebrew too: the presets name g++-16, and the runner's
  # non-root user keeps the permission tests meaningful.
  cutils-linux:
    name: cutils (linux gcc asan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Put Homebrew on PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      # The runner kernel's mmap randomisation can land on ASan's shadow memory.
      - name: Lower mmap randomisation for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: brew install gcc ninja
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: cutils-linux-gcc-asan
      - name: Configure
        run: >
          cmake -S cutils -B build/cutils -G Ninja -DCMAKE_CXX_COMPILER=g++-16
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build/cutils
      - run: ctest --test-dir build/cutils --output-on-failure

  remmy-linux:
    name: remmy (linux ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Put Homebrew on PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: brew install gcc ninja
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: remmy-linux-${{ matrix.preset }}
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset ${{ matrix.preset }}
      # Runs the pytest end-to-end suite (tests/) against the built executable.
      - run: ctest --preset ${{ matrix.preset }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Pinned wheel: the same formatter on every runner, without Homebrew.
      - name: Check formatting
        run: git ls-files '*.c' '*.h' '*.cpp' '*.hpp' | xargs uvx clang-format==22.1.8 --style=file --dry-run --Werror

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --locked ruff check tests
      - run: uv run --locked ruff format --check tests

  clang-tidy:
    name: clang-tidy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install llvm ninja
      - name: Put Homebrew LLVM first on PATH
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      # The lint preset compiles cutils with clang++ and runs clang-tidy on every
      # translation unit; .clang-tidy makes every warning an error.
      - run: cmake --preset lint
      - run: cmake --build --preset lint

  cutils:
    name: cutils (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC is the compiler remmy ships with.
          - name: gcc asan
            cxx: g++-16
            tsan: "OFF"
            brew: gcc ninja
          # Clang adds integer, bounds and nullability checks.
          - name: clang asan
            cxx: clang++
            tsan: "OFF"
            brew: llvm ninja
          - name: clang tsan
            cxx: clang++
            tsan: "ON"
            brew: llvm ninja
    steps:
      - uses: actions/checkout@v4
      - run: brew install ${{ matrix.brew }}
      - name: Put Homebrew LLVM first on PATH
        if: contains(matrix.brew, 'llvm')
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: cutils-macos-${{ matrix.name }}
      - name: Configure
        run: >
          cmake -S cutils -B build/cutils -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCUTILS_TEST_TSAN=${{ matrix.tsan }}
      - run: cmake --build build/cutils
      - run: ctest --test-dir build/cutils --output-on-failure

  remmy:
    name: remmy (${{ matrix.preset }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - run: brew install gcc ninja
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: remmy-macos-${{ matrix.preset }}
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset ${{ matrix.preset }}
      # Runs the pytest end-to-end suite (tests/) against the built executable.
      # Parity checks output bytes, not build-type behaviour: release covers it,
      # and scores it for the README badge (parity-badge).
      - run: ctest --preset ${{ matrix.preset }}
        env:
          PYTEST_ADDOPTS: >-
            ${{ matrix.preset == 'debug' && '-m "not parity"'
            || format('--parity-report={0}/parity/parity.json', github.workspace) }}
      - name: Summarize rm parity
        if: always() && hashFiles('parity/parity.json') != ''
        run: |
          jq -r '
            "### rm parity: \(.percent)% (\(.passed)/\(.total) cases)\n",
            "| Gap | Failing cases |", "| --- | ---: |",
            (.deferred as $d | .failing | to_entries[]
              | "| `\(.key)`\(if .key | IN($d[]) then " (deferred)" else "" end) | \(.value) |"),
            (.unlisted[] | "| unlisted: `\(.)` | 1 |")
          ' parity/parity.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: hashFiles('parity/parity.json') != ''
        with:
          name: parity
          path: parity/parity.json

  # Publishes main's rm parity score as a shields.io endpoint on the badges
  # branch, which holds that one file in a single force-pushed commit. Only a
  # green run is scored: a failing one may not have run every case.
  parity-badge:
    name: parity badge
    needs: remmy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: parity
      - name: Render the badge
        run: |
          jq '
            if .total == 0 then error("no parity case ran") else . end
            | {
                schemaVersion: 1,
                label: "rm parity",
                message: "\(.percent)%",
                color: (.percent | if . >= 95 then "brightgreen" elif . >= 85 then "green"
                        elif . >= 75 then "yellowgreen" elif . >= 60 then "yellow" else "orange" end)
              }
          ' parity.json > badge.json
          cat badge.json
      - name: Push to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir out && mv badge.json out/parity.json && cd out
          git init -q -b badges
          git add parity.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "rm parity badge for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/badges

  # Linux runs GCC from Homebrew too: the presets name g++-16, and the runner's
  # non-root user keeps the permission tests meaningful.
  cutils-linux:
    name: cutils (linux gcc asan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Put Homebrew on PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      # The runner kernel's mmap randomisation can land on ASan's shadow memory.
      - name: Lower mmap randomisation for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: brew install gcc ninja
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: cutils-linux-gcc-asan
      - name: Configure
        run: >
          cmake -S cutils -B build/cutils -G Ninja -DCMAKE_CXX_COMPILER=g++-16
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build/cutils
      - run: ctest --test-dir build/cutils --output-on-failure

  remmy-linux:
    name: remmy (linux ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Put Homebrew on PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: brew install gcc ninja
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: remmy-linux-${{ matrix.preset }}
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset ${{ matrix.preset }}
      # Runs the pytest end-to-end suite (tests/) against the built executable.
      - run: ctest --preset ${{ matrix.preset }}

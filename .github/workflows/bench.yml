name: Bench

# Times the release binary on the dedicated bare-metal runner (ci/bench-host).
# demo (minutes) runs on every push to main and on PRs the owner opens from a
# branch of this repository; full (hours) runs nightly when main has moved.
# External PRs are never benchmarked: no review, approval or label changes
# that. The plan job skips them cleanly, but the guarantee is
# ci/bench-host/bench-job-gate.sh on the runner, because a PR brings its own
# copy of this file. This workflow holds no secrets: bench-track.yml uploads
# the results to Bencher.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: demo (minutes) or full (hours)
        type: choice
        options: [demo, full]
        default: demo

permissions:
  contents: read

env:
  # Keep in sync with release.yml: benchmarks time the binary users download.
  # Fully qualified: podman, unlike docker, has no default registry.
  GCC_IMAGE: docker.io/library/gcc:16.2.0-trixie@sha256:ef558a40d1f13115293feee01526dbdb9aaad7c9c5a00da05f471ce042e855c1
  # The machine's control: a release that never changes, timed next to remmy on
  # every non-PR run. If its ratio to rm moves, the machine changed, not remmy.
  CONTROL_NAME: v0.1.0
  CONTROL_URL: https://github.com/markovejnovic/remmy/releases/download/v0.1.0/remmy-Linux-x86_64.tar.gz
  CONTROL_SHA256: 9aef985b47c765ad24851d09087f829ee4308b4a3b585fa861f5f1ce74504354

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      suite: ${{ steps.plan.outputs.suite }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          run=false suite=demo
          if [[ "$ACTOR" != "$OWNER" || "$TRIGGERING_ACTOR" != "$OWNER" ]]; then
            echo "not benchmarking: started by $ACTOR/$TRIGGERING_ACTOR, not $OWNER"
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "suite=demo" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT" in
            pull_request)
              if [[ "$HEAD_REPO" == "$REPO" && "$AUTHOR" == "$OWNER" ]]; then
                run=true
              else
                echo "not benchmarking: external PR ($AUTHOR, $HEAD_REPO); those never run here"
              fi
              ;;
            push) run=true ;;
            schedule)
              suite=full
              last="$(gh run list -R "$REPO" -w bench.yml -e schedule -s success -L 1 --json headSha -q '.[0].headSha // ""')"
              if [[ "$last" == "$SHA" ]]; then
                echo "main is still at the last nightly's commit ${SHA::12}: skipping"
              else
                run=true
              fi
              ;;
            workflow_dispatch) run=true suite="$INPUT_SUITE" ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "suite=$suite" >> "$GITHUB_OUTPUT"

  bench:
    name: Bench (${{ needs.plan.outputs.suite }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: [self-hosted, linux, remmy-bench]
    timeout-minutes: ${{ needs.plan.outputs.suite == 'full' && 720 || 60 }}
    # One runner serves every job, so they queue on it anyway. A newer push to a
    # PR supersedes its running demo; main and nightly runs always finish.
    concurrency:
      group: bench-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      SUITE: ${{ needs.plan.outputs.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A cancelled run can leave trees behind on the measured volume.
      - name: Clear /bench
        run: find /bench -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf -- {} +

      # Rootless podman: files the container's root writes belong to the runner.
      - name: Build (static release, as shipped)
        run: &build |
          podman run --rm -v "$PWD:/src" -w /src "$GCC_IMAGE" \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get -o Acquire::Retries=5 update -qq
              apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends cmake ninja-build
              cmake --preset dist -DCMAKE_CXX_COMPILER=g++
              cmake --build --preset dist
              strip build/gcc-dist/remmy
            '

      # A PR is judged against main where it branched, timed in the same rounds:
      # drift between runs cancels. That commit is on main, so it was reviewed.
      - name: Check out main at the PR's base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
      - name: Build main at the PR's base
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}/base
        run: *build

      - name: Fetch the control release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/control"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/control.tar.gz" "$CONTROL_URL"
          echo "$CONTROL_SHA256  $RUNNER_TEMP/control.tar.gz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/control.tar.gz" -C "$RUNNER_TEMP/control" --strip-components=1

      # No GitHub cache: a job on this machine must never write an entry that a
      # GitHub-hosted job (a release, say) could restore. uv is pinned.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
      - run: uv sync --locked

      # Every suite starts from the same state: freed blocks handed back to the
      # SSD, and no page cache left over from the build or earlier jobs.
      - name: Trim /bench, drop caches
        run: |
          sudo -n /usr/local/sbin/bench-ctl fstrim
          sudo -n /usr/local/sbin/bench-ctl drop-caches

      - name: Benchmark
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ "$IS_PR" == true ]]; then
            baseline="main=$RUNNER_TEMP/base/build/gcc-dist/remmy"
          else
            baseline="$CONTROL_NAME=$RUNNER_TEMP/control/remmy"
          fi
          uv run --locked pytest tests/bench/test_benchmark.py -p no:xdist -p no:cacheprovider \
            --bench="$SUITE" \
            --remmy "$GITHUB_WORKSPACE/build/gcc-dist/remmy" \
            --bench-baseline "$baseline" \
            --bench-scratch /bench \
            --bench-out "$RUNNER_TEMP/bench"

      - name: Convert for Bencher
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          uv run --locked python tests/bench/bmf.py "$RUNNER_TEMP/bench/run.json" > "$RUNNER_TEMP/bench/bmf.json"
          jq -n --arg suite "$SUITE" --arg event "$EVENT" --arg sha "$SHA" \
            '{suite: $suite, event: $event, sha: $sha}' > "$RUNNER_TEMP/bench/meta.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: ${{ runner.temp }}/bench
          retention-days: 90
          if-no-files-found: error

      # Last, so the results are uploaded (and tracked) even when this fails.
      - name: Compare with main
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          fail=()
          [[ "$IS_PR" == true ]] && fail=(--fail-on main)
          status=0
          uv run --locked python tests/bench/compare.py "$RUNNER_TEMP/bench/run.json" "${fail[@]}" \
            > "$RUNNER_TEMP/compare.md" || status=$?
          cat "$RUNNER_TEMP/compare.md" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
